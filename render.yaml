services:
  # Backend API Web Service (FastAPI)
  - type: web
    name: satquery-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir Backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"

  # Frontend Static Site (React / Vite)
  - type: web
    name: satquery-ai-frontend
    env: static
    plan: free
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: satquery-ai-backend
          property: host
